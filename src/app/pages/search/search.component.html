<div class="booking-card">
    <h4><i class="fas fa-ticket-alt"></i> Book Your Bus Ticket</h4>
    <form>
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-map-marker-alt"></i>From</label>
        <select class="form-select" name="fromLocationId" [(ngModel)]="searchObj.fromLocationId">
            <option value="">Select From Location</option>
            @for (item of locationList; track $index) {
                <option [value]="item.locationId">{{item.locationName}}</option>

            }
            
        </select>
        
      </div>
      <div class="mb-3">
        <label class="form-label"><i class="fas fa-map-pin"></i>To</label>
        <select class="form-select" name="toLocationId" [(ngModel)]="searchObj.toLocationId">
            <option value="">Select To Location</option>
            @for (item of locationList; track $index) {
                <option [value]="item.locationId">{{item.locationName}}</option>

            }
            
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label"><i class="fas fa-calendar-alt"></i>Date of Journey</label>
        <input type="text" name="date" [(ngModel)]="searchObj.date" class="form-control" placeholder="dd-mm-YYYY" onfocus="(this.type='date')" required>
      </div>
      <button type="button" (click)="searchBus()" class="btn btn-search">
        <i class="fas fa-search"></i> Search Buses
      </button>
    </form>
  </div>
